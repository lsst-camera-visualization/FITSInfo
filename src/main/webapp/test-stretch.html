<html>
<head>
<title>Test with State</title>
<link rel='stylesheet' type='text/css' media='screen'
      href='https://openseadragon.github.io/css/style.css' />
<script src="openseadragon/openseadragon.js"></script>
<script src="d3.min.js"></script>
<script src="plot.min.js"></script>
<script src="openseadragon-filtering-lsst.js"></script>
<script src="colorstretch.js"></script>
</head>
<body>
<h1>Test with state</h1>

<div id="container">
<div style="padding: 0 1.5em; height: 600px;">
    <div class="info" style="float: left; width: 300px;">
        <div class="position"></div>
        <div class="zoom" style="margin-top: 3em;"></div>
        <div class="rgb" style="margin-top: 3em;"></div>
        D3/Plot histogram:
        <div id="plothist"></div>
        <div class="colorstats" style="margin-top: 3em;"></div>
        <div class="colorquery" style="margin-top: 3em;"></div>
    </div>
    <div id="openseadragon1" style="float: right; width: 380px; height: 500px; background: black;"></div>
</div>
</p>
<br>

<p> Color histogram:<br>
<canvas id="colorbar" width="700" height="250" style="border:1px solid grey"></canvas>
</p>

    <script>

//
// responses to actions:
// - zoom:  set overall state to "accumulate".
//          set filter processor to accumulate.
// - animation-finish:  if in "accumulate", set to "new-stretch".
//                      if in "new-stretch", set to "old-stretch"
//                      set filter processor to stretch.
//

// NEEDS PATCHED OPENSEADRAGON-FILTERING.JS.
// Otherwise this will get the zoom levels mixed up when
// making the pixel value histograms needed for auto-scaling.

//===============================================================
// viewer
//===============================================================

    var positionEl = document.querySelectorAll('.info .position')[0];
    //positionEl.innerHTML = 'hello there';
    var zoomEl = document.querySelectorAll('.info .zoom')[0];
    //zoomEl.innerHTML = 'zoom this';
    var rgbEl = document.querySelectorAll('.info .rgb')[0];

    var updateZoom = function() {
        var zoom = viewer.viewport.getZoom(true);
        zoomEl.innerHTML = 'Zoom:<br>' + (Math.round(zoom * 100) / 100);
    }

    var openHandler = function() {
      var tracker = new OpenSeadragon.MouseTracker({
        element: viewer.container,
        moveHandler: function(event) {
            var webPoint = event.position;
            var viewportPoint = viewer.viewport.pointFromPixel(webPoint);
            var vworld = viewer.world;
            for (var i = 0; i < vworld.getItemCount(); ++i) {
              var img = vworld.getItemAt(i);
              var rect = img.getBounds(true); // rect in viewport coordinates
              if (rect.containsPoint(viewportPoint)) {
                var imagePoint = img.viewportToImageCoordinates(viewportPoint);
                positionEl.innerHTML = 'Web:<br>' + webPoint.toString() + 
                    '<br><br>Viewport:<br>' + viewportPoint.toString() +
                    '<br><br>Item:<br>' + i +
                    '<br><br>Image:<br>' + imagePoint.toString();
                break;
              }
              positionEl.innerHTML = 'Web:<br>' + webPoint.toString() + 
                  '<br><br>Viewport:<br>' + viewportPoint.toString();
            }
            updateZoom();     
        }
      });  

      tracker.setTracking(true);  

      viewer.addHandler('animation', updateZoom);   
      viewer.addHandler('tile-drawing', function(ev) { console.log('tile-drawing'); });
      viewer.addHandler('tile-loaded', function(ev) { console.log('tile-loaded'); });
      viewer.addHandler('animation-finish', function(ev) { console.log('animation-finish'); });
    }

    var viewer = OpenSeadragon({
        id: "openseadragon1",
        prefixUrl: "openseadragon/images/",
        showNavigator: true,
        crossOriginPolicy: true,
        maxZoomPixelRatio: 4,
        debugMode: false
      });

    viewer.navigator.setFilterOptions = viewer.setFilterOptions;

    openHandler();

/*
    viewer.addTiledImage({
        tileSource: "http://localhost:8172/iiif/3/testd$source=direct$colorMap=null/info.json",
        x: 0.0, y: 0.0, width: 1.0
      });
*/

    viewer.addTiledImage({
        tileSource: "http://localhost:8172/iiif/3/post_isr_image_LSSTCam_r_57_MC_O_20250511_000866_R22_S00_LSSTCam_runs_quickLook_3$source=direct$colorMap=null/info.json",
        x: 0.0, y: 0.0, width: 0.5
      });
/*
    viewer.addTiledImage({
        tileSource: "http://localhost:8172/iiif/3/post_isr_image_LSSTCam_r_57_MC_O_20250511_000866_R22_S01_LSSTCam_runs_quickLook_3$source=direct$colorMap=null/info.json",
        x: 0.0, y: 0.0, width: 1.0
      });
*/

    // simple auto-scale filter
    var simpleAutoScaleFilter = function(context, callback) {
      console.log('simpleAutoScaleFilter wxh=' + context.canvas.width + 'x' + context.canvas.height);
      if (context.zoomlevel) console.log('  zoomlevel=' + context.zoomlevel);
      const imgData = context.getImageData(0, 0, context.canvas.width, context.canvas.height);
      const pxl = imgData.data;
      const nhist = ColorStretch.filter.accumulate(pxl, ColorStretch.decoders.raw);
      const nstretch = nhist.makeStretcher(ColorStretch.colormaps.gray);
      ColorStretch.filter.apply(pxl, ColorStretch.decoders.raw, nstretch);
      context.putImageData(imgData, 0, 0);
      callback();
    };

    // scale pixels for the navigator.
    // Omit drawing the colorbar and histogram.
    viewer.navigator.setFilterOptions({
      filters: { processors: simpleAutoScaleFilter }
    });

    // state (for each level):
    // 0 (or undefined) = need to create new histogram
    // 1 = accumulate histogram, use old stretch if exists
    // 2 = make new stretch function, use it
    // 3 = use old stretch function
    var state = [];

    // accumulator array of Array(1<<18)
    var accdata = [];
    // histogram array of ColorStretch.Histogram(accdata[level], 0, 1<<18);
    var acchist = [];
    // persistent ColorStretch objects for each level
    var stretch = [];

    // colormap
    ColorStretch.colormaps.underflow = [0, 0, 255, 255];
    ColorStretch.colormaps.overflow = [255, 0, 0, 255];
    const cmap = ColorStretch.colormaps.saoA;

    var drawColorbarHistogram = function(chist, stretcher) {
      const renderer = new ColorStretch.Renderer(chist, 700, 250, 0.1, 0.25);
      renderer.logy = true; // linear y scale for histogram
      const colorbar = document.getElementById("colorbar");
      const ctx = colorbar.getContext("2d");
      // draw the histogram and colorbar
      ctx.clearRect(0, 0, 700, 250);
      renderer.draw(ctx, stretcher);
      // add a mouse listener for histogram
      colorbar.addEventListener('mousemove', function(e) {
        let cq = document.querySelectorAll('.info .colorquery')[0];
        let d = renderer.info(e.offsetX);
        if (d.valid) {
          cq.innerHTML = "Value=" + d.value + " counts=" + d.counts;
        } else {
          cq.innerHTML = "";
        }
      });
    };

    // EXAMPLE D3/PLOT CODE
    // histogram of pixel values, excluding zeroes
    var drawD3Histogram = function(chist) {
      let xy = new Array(chist.nbins());
      let j = 0;
      let nu = 0;
      let no = 0;
      let sum = 0;
      let num = 0;
      for (let i = 0; i < chist.nbins(); i++) {
        const x = chist.xlo + i * chist.dx();
        sum += chist.data[i] * x;
        num += chist.data[i];
        if (x >= (1<<18)) {
          no += chist.data[i];
        } else if (x > 261200) {
          xy[j++] = new Array(x, chist.data[i]);
        } else {
          nu += chist.data[i];
        }
      }
      let a = xy.slice(0, j);
      const plt = Plot.line(a).plot();
      let plothist = document.getElementById("plothist");
      if (plothist) plothist.replaceChildren(plt);
    };

    // filter which accumulates and/or draws for auto-scale
    var autoScaleFilter = function(context, callback) {
      console.log('autoScaleFilter level=' + context.zoomlevel +
                  ' state=' + state[context.zoomlevel]);
      const imgData = context.getImageData(0, 0, context.canvas.width,
                                                 context.canvas.height);
      const pxl = imgData.data;
      const level = context.zoomlevel;

      if (!state[level]) {
        const asize = (1 << 18);
        state[level] = 1;
        accdata[level] = new Array(asize);
        for (let i = 0; i < asize; i++) accdata[level][i] = 0;
        acchist[level] = new ColorStretch.Histogram(accdata[level], 0, asize);
      }

      if (state[level] == 3) {
        // do nothing
      } else if (state[level] == 1) {
        ColorStretch.filter.fill(acchist[level], pxl,
                                 ColorStretch.decoders.raw);
        // wait for fully-loaded-change(status) to change state to 2
      } else if (state[level] == 2) {
        stretch[level] = acchist[level].makeStretcher(cmap);
        // draw histograms
        const chist = acchist[level].trim(200000);
        drawColorbarHistogram(chist, stretch[level]);
        drawD3Histogram(chist);
        // now just use this stretch function
        state[level] = 3;
      }

      let stretcher = null;
      if (stretch[level]) {
        console.log('found stretcher at right level ' + level);
        stretcher = stretch[level];
      } else {
        // search among higher stretch levels
        for (let i = level+1; i < stretch.length; i++) {
          if (stretch[i]) {
            console.log('found stretcher at upper level ' + i);
            stretcher = stretch[i];
            break;
          }
        }
        if (!stretcher) {
          for (let i = level-1; i >= 0; i--) {
            if (stretch[i]) {
              console.log('found stretcher at lower level ' + i);
              stretcher = stretch[i];
              break;
            }
          }
        }
      }

      // if can't find an old stretch, make it with what we have
      if (!stretcher) {
        stretch[level] = acchist[level].makeStretcher(cmap);
        stretcher = stretch[level];
        console.log('no stretcher, so make temporary one at leve ' + level);
      }

      ColorStretch.filter.apply(pxl, ColorStretch.decoders.raw, stretcher);
      context.putImageData(imgData, 0, 0);
      callback();
    };

    // zoom should be raised when zoom level changed.
    viewer.addHandler('zoom', function(ev) {
      console.log('- zoom called with ' + ev.zoom);
      for (i in state) state[i] = 0;
      for (i in accdata) delete accdata[i];
      for (i in acchist) delete acchist[i]; // does Histogram need a cleanup method?
      viewer.setFilterOptions({
        filters: { processors: autoScaleFilter }
      });
    });

    viewer.addHandler('animation-finish', function(ev) {
      viewer.setFilterOptions({
        filters: { processors: autoScaleFilter, loadMode: 'sync' }
      });
    });

    var loadChangeHandler = function(ev) {
      // it looks as if condition for successful load is
      // that tilesMatrix entry exists (is a Tile),
      // and coverage[level][x][y] is true, for all x,y at given level.
      // TilesImage.getFullyLoaded() seems to be true if any of
      // the above are true, for any (?) level.

      console.log('fully-loaded-change');
      let loaded = [];
      let covered = [];
      for (let i = 0; i < viewer.world.getItemCount(); i++) {
        const ti = viewer.world.getItemAt(i);
        //console.log('  item ' + i + ' fully loaded: ' + ti.getFullyLoaded());
        if (!ti.getFullyLoaded()) return; // not fully loaded yet
        // if fully loaded, find out which levels are loaded
        for (let lvl in ti.loadingCoverage) {
          //console.log('  level ' + lvl + ' state ' + state[lvl]);
          if (!(lvl in state)) break;
          if (state[lvl] == 3) break;
          if (!(lvl in loaded)) loaded[lvl] = true;
          for (k1 in ti.loadingCoverage[lvl]) {
            //console.log('    x ' + k1);
            for (k2 in ti.loadingCoverage[lvl][k1]) {
              //console.log('      y ' + k2 +
              //            ' loaded ' + ti.loadingCoverage[lvl][k1][k2]);
              loaded[lvl] = loaded[lvl] && ti.loadingCoverage[lvl][k1][k2];
            }
          }
          if (!(lvl in covered)) covered[lvl] = true;
          for (k1 in ti.coverage[lvl]) {
            //console.log('    x ' + k1);
            for (k2 in ti.coverage[lvl][k1]) {
              //console.log('      y ' + k2 +
              //            ' covered ' + ti.coverage[lvl][k1][k2]);
              covered[lvl] = covered[lvl] && ti.coverage[lvl][k1][k2];
            }
          }
        }
      }
      let apply = false;
      for (let lvl in loaded) {
        if (loaded[lvl] && covered[lvl]) {
          state[lvl] = 2;
          apply = true;
          //console.log('  level ' + lvl + ' loaded');
        }
      }

      if (apply) {
        // all TiledImages fully loaded - reset and redraw
        viewer.setFilterOptions({
          filters: { processors: autoScaleFilter, loadMode: 'sync' }
        });
      }
    };

    viewer.world.addHandler('add-item', function(ev) {
      const ti = ev.item;
      ti.addHandler('fully-loaded-change', loadChangeHandler);
    });

    </script>
    <noscript>
      <p>OpenSeadragon not available unless JS enabled</p>
    </noscript>
</div>

</body>
</html>
