<html>
    <head>
        <title>LSST Camera Image Browser</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <link rel="stylesheet" type="text/css" href="https://cdn3.devexpress.com/jslib/20.2.5/css/dx.common.css" />
        <link rel="dx-theme" data-theme="generic.light" href="https://cdn3.devexpress.com/jslib/20.2.5/css/dx.light.css" />
        <script src="https://cdn3.devexpress.com/jslib/20.2.5/js/dx.all.js"></script>
        <style>
            #gridContainer {
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="gridContainer"></div>
        <script>
            $(function () {
                let urlParams = new URLSearchParams(window.location.search);
                let view = urlParams.get('view');
                let dataSources = [];
                let site;
                let dataGrid;
                // Per-site config (telCode + grid column layout), keyed by label. Populated
                // from the backend up front so setView() can stay synchronous.
                let siteConfigByLabel = {};
                // The data-source catalog (labels + order) now comes from the backend,
                // resolved per host, replacing the previous hard-wired host detection.
                let host = window.location.hostname;
                $.getJSON(`rest/config?host=${encodeURIComponent(host)}`, function (config) {
                    dataSources = config.sites.map(s => s.label);
                    console.log(dataSources);
                    if (!isNotEmpty(view)) {
                        view = dataSources[0];
                    }
                    // Fetch every visible site's config, then build the grid once they are
                    // all cached so the initial setView() and dropdown switches are instant.
                    let fetches = config.sites.map(s =>
                        $.getJSON(`rest/${s.key}/config?host=${encodeURIComponent(host)}`, function (cfg) {
                            cfg.key = s.key;
                            siteConfigByLabel[s.label] = cfg;
                        })
                    );
                    $.when.apply($, fetches).then(buildGrid);
                });
                let gridDataSource = new DevExpress.data.DataSource({
                    key: "obsId",
                    load: function (loadOptions) {
                        var d = $.Deferred(),
                                params = {};
                        [
                            "skip",
                            "take",
                            "requireTotalCount",
                            "requireGroupCount",
                            "sort",
                            "filter",
                            "totalSummary",
                            "group",
                            "groupSummary"
                        ].forEach(function (i) {
                            if (i in loadOptions && isNotEmpty(loadOptions[i]))
                                params[i] = JSON.stringify(loadOptions[i]);
                        });
                        $.getJSON("rest/"+site+"/images", params)
                                .done(function (result) {
                                    d.resolve(result.data, {
                                        totalCount: result.totalCount,
                                        summary: result.summary,
                                        groupCount: result.groupCount
                                    });
                                });
                        return d.promise();
                    }
                });
                function isNotEmpty(value) {
                    return value !== undefined && value !== null && value !== "";
                }
                
                function setView(view) {
                    // Column layout and telCode filter for each view are now driven by the
                    // backend site config (sites.json), replacing the former per-view branches.
                    let cfg = siteConfigByLabel[view];
                    if (!cfg) {
                        // Fall back to the first (default) catalog entry, matching the old
                        // else-branch behavior of an unrecognized view.
                        cfg = siteConfigByLabel[dataSources[0]];
                    }
                    site = cfg.key;
                    dataGrid.filter(["telCode", "=", cfg.telCode]);
                    cfg.grid.columns.forEach(function (c) {
                        if ("visible" in c) {
                            dataGrid.columnOption(c.name, "visible", c.visible);
                        }
                        if ("groupIndex" in c) {
                            // JSON null means "ungroup" -> DevExtreme wants undefined.
                            dataGrid.columnOption(c.name, "groupIndex",
                                    c.groupIndex === null ? undefined : c.groupIndex);
                        }
                    });
                }

                function buildGrid() {
                dataGrid = $("#gridContainer").dxDataGrid({
                    dataSource: gridDataSource,
                    showBorders: true,
                    rowAlternationEnabled: true,
                    allowColumnReordering: true,
                    allowColumnResizing: true,
                    columnAutoWidth: true,
                    onToolbarPreparing: function (e) {
                        e.toolbarOptions.items.unshift({
                            location: "before",
                            widget: "dxSelectBox",
                            options: {
                                dataSource: dataSources,
                                value: view,
                                onValueChanged: function (data) {
                                    setView(data.value);
                                }
                            }
                        });
                    },
                    columnChooser: {
                        enabled: true,
                        mode: "dragAndDrop"
                    },
                    remoteOperations: {
                        groupPaging: true
                    },
                    grouping: {
                        autoExpandAll: false
                    },
                    searchPanel: {
                        visible: true
                    },
                    scrolling: {
                        mode: "virtual"
                    },
                    groupPanel: {
                        visible: true
                    },
                    columns: [
                        {
                            dataField: "obsId",
                            sortOrder: "desc"
                        },
                        {
                            dataField: "imgType",
                            caption: "Image Type"
                        },
                        "testType",
                        {
                            dataField: "exposureTime",
                            caption: "Exp Time",
                            visible: true
                        },
                        {
                            dataField: "darkTime",
                            caption: "Dark Time",
                            visible: true
                        },
                        {
                            dataField: "obsDate",
                            caption: "Obs Time",
                            allowSearch: false,
                            customizeText: function (cellInfo) {
                                return new Date(cellInfo.value).toISOString().substring(0, 19);
                            }
                        },
                        {
                            dataField: "raftMask",
                            caption: "Rafts",
                            allowSearch: false,
                            cellTemplate: function (element, cellInfo) {

                                let mask = cellInfo.value;
                                let n = 0;
                                for (let i = 0; i < 25; i++) {
                                    if (mask >> i & 1) {
                                        let raft = `R${Math.floor(i / 5)}${i % 5}`;
                                        element.append(`<a href="view.html?image=${cellInfo.data.obsId}&raft=${raft}" target="imageViewer">${raft}</a> `);
                                        n++;
                                    }
                                }
                                if (n > 2) {
                                    element.prepend(`<a href="view.html?image=${cellInfo.data.obsId}&raft=all" target="imageViewer">All</a> `);
                                }
                            }
                        },                       
                        {
                            dataField: "runNumber",
                            visible: false,
                            sortOrder: "desc"
                        },
                        {
                            dataField: "run",
                            visible: false,
                            sortOrder: "desc"
                        }, 
                        {
                            dataField: "runMode",
                            visible: false,
                            sortOrder: "desc"
                        }, 
                        {
                            dataField: "dayobs",
                            caption: "Obs Day",
                            visible: false,
                            sortOrder: "desc"
                        },
                        {
                            dataField: "controller",
                            visible: false
                        },
                        {
                            dataField: "seqnum",
                            visible: false,
                            allowSearch: false
                        },
                        {
                            dataField: "telCode",
                            visible: false
                        },
                        {
                            dataField: "fileLocation",
                            visible: false
                        },
                        {
                            dataField: "tstand",
                            visible: false
                        }
                    ],
                    summary: {
                        groupItems: [{
                                column: "runNumber",
                                summaryType: "custom",
                                displayFormat: "{0} images"
                            }]
                    }
                }).dxDataGrid("instance");
                setView(view);
                }
            });
        </script>
    </body>
</html>
